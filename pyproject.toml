[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "code-complexity-predictor"
version = "0.1.0"
description = "Leakage-aware C++ code complexity classification research pipeline"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2", "numpy>=2,<3", "rapidfuzz>=3.10,<4", "threadpoolctl>=3,<4"]
[project.optional-dependencies]
notebooks = ["jupyter>=1,<2", "matplotlib>=3.8,<4", "pandas>=2.2,<4"]
neural = ["torch>=2.5,<3"]
dev = ["pytest>=8,<10"]
[project.scripts]
complexity-train = "src.models.train_model:main"
complexity-predict = "src.models.predict_model:main"
complexity-data = "src.data.make_dataset:main"
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
